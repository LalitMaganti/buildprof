name: Released GitHub Action

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  record:
    name: Record with release defaults (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the released action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check action release metadata
        run: python3 infra/prepare-action-release --check

      - name: Check out zlib
        uses: actions/checkout@v7
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf # v1.3.1
          path: zlib
          persist-credentials: false

      - name: Record using the default recorder version
        id: record
        uses: ./
        with:
          artifact-name: released-action-${{ matrix.runner }}
          command: |
            cmake -S zlib -B zlib-build -DCMAKE_BUILD_TYPE=Release
            cmake --build zlib-build --parallel 2
            ctest --test-dir zlib-build --output-on-failure

      - name: Verify upload
        env:
          ARTIFACT_URL: ${{ steps.record.outputs.artifact-url }}
        run: test -n "$ARTIFACT_URL"
