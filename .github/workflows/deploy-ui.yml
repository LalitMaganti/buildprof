name: Deploy Buildprof UI

# Runs after dist has published a GitHub release. Builds that release's UI,
# attaches it to the release as buildprof-ui-v<version>.tar.zst, assembles the
# site from every released UI plus the example recordings, deploys it, and
# only then publishes the crate, so a CLI on crates.io never points at a UI
# version that is not live.
on:
  release:
    types: [released]
  workflow_dispatch:

concurrency:
  group: buildprof-ui-production
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://buildprof.lalitm.com
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Build the patched Perfetto UI
        uses: ./.github/actions/build-perfetto-ui

      - name: Package the UI release asset
        run: uv run tools/perfetto package-ui --output-dir ui-asset

      - name: Attach the UI to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ui-asset/*.tar.zst --clobber

      - name: Assemble the site from every released UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          infra/buildprof.lalitm.com/assemble-site \
            --current ui-asset/buildprof-ui-*.tar.zst \
            --out site \
            --headers infra/buildprof.lalitm.com/_headers

      - name: Validate deployment assets
        run: infra/buildprof.lalitm.com/validate-assets site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=buildprof --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        if: github.event_name == 'release'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - name: Publish to crates.io
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
