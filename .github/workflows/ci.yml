name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.91"

jobs:
  linux:
    name: Linux conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Mirrors the package list in the Containerfile so the conformance suite
      # exercises every supported build system rather than skipping them.
      - name: Install build systems
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ libc6-dev make cmake ninja-build meson golang-go binutils llvm \
            podman nodejs npm zstd

      - name: Install Bazel
        run: sudo sh dev/install-bazel

      - name: Install Buck2
        run: sudo sh dev/install-buck2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      # Compiler tracing collects rustc self-profile data, which needs nightly.
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Format, lint, build, unit tests, conformance suite
        env:
          BUILDPROF_REQUIRE_TOOLS: "1"
        run: uv run dev/in-container-test

      - name: Check action release metadata
        run: python3 infra/prepare-action-release --check --allow-preview

      - name: Verify the crate packages
        run: cargo package --locked

  action:
    name: GitHub Action (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check out zlib
        uses: actions/checkout@v7
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf # v1.3.1
          path: zlib
          persist-credentials: false

      - name: Record a zlib build and test run
        id: success
        uses: ./
        with:
          # Before publishing, the upcoming recorder assets are unavailable.
          version: v0.2.5
          artifact-name: action-success-${{ matrix.runner }}
          command: |
            cmake -S zlib -B zlib-build -DCMAKE_BUILD_TYPE=Release
            cmake --build zlib-build --parallel 2
            ctest --test-dir zlib-build --output-on-failure

      - name: Record a failing command
        id: failure
        continue-on-error: true
        uses: ./
        with:
          version: v0.2.5
          artifact-name: action-failure-${{ matrix.runner }}
          command: exit 7

      - name: Verify outcomes and uploads
        env:
          SUCCESS_URL: ${{ steps.success.outputs.artifact-url }}
          FAILURE_URL: ${{ steps.failure.outputs.artifact-url }}
          FAILURE_OUTCOME: ${{ steps.failure.outcome }}
        run: |
          test -n "$SUCCESS_URL"
          test -n "$FAILURE_URL"
          test "$FAILURE_OUTCOME" = failure

  ui:
    name: Perfetto UI build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the patched Perfetto UI
        uses: ./.github/actions/build-perfetto-ui

      # The same packaging and assembly the deploy runs, minus the deploy.
      - name: Package and assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run tools/perfetto package-ui --output-dir ui-asset
          infra/buildprof.lalitm.com/assemble-site \
            --current ui-asset/buildprof-ui-*.tar.zst \
            --out site \
            --headers infra/buildprof.lalitm.com/_headers
          infra/buildprof.lalitm.com/validate-assets site

  macos:
    name: macOS viewer build
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets --locked
