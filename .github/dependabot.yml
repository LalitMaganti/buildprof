# Keeps the actions in .github/workflows and .github/actions current. All
# bumps land in one monthly pull request. release.yml is generated by dist
# (see RELEASING.md), so a bump there is folded into the next dist upgrade.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
