# registry/buildprof.toml in https://github.com/jdx/mise; the GitHub backend
# picks the glibc tarball on Linux and the matching macOS build, and verifies
# the release's provenance.
backends = ["github:LalitMaganti/buildprof"]
bins = ["buildprof"]
description = "Records every process and file access in a build and shows it as an interactive timeline"
os = ["linux", "macos"]
test = { cmd = "buildprof --version", expected = "buildprof {{version}}" }
version_order = "semver"
